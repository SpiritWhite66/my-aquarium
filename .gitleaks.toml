# Configuration de gitleaks : règles par défaut + les faux jetons des tests.
[extend]
useDefault = true

[[allowlists]]
description = "Faux jetons administrateur des tests (jamais utilisés ailleurs)"
regexes = ['''jeton-(de-test|e2e)-[0-9a-z-]+''']
paths = ['''api/e2e/ref\.e2e\.ts''', '''api/src/ref/routes\.spec\.ts''']
condition = "AND"

[[allowlists]]
description = "Fausses clés et faux secrets des tests de l'API (valeurs inventées, jamais utilisées ailleurs)"
targetRules = ['generic-api-key']
paths = ['''api/src/.*\.spec\.ts''', '''api/e2e/.*\.e2e\.ts''']
