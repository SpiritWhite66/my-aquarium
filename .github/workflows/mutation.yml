name: Tests de mutation

# Sur une pull request : seulement les fichiers modifiés. Sur main (et à la demande) : tout le code
# concerné, mais en mode incrémental — seuls les mutants dont le code ou les tests ont changé sont rejoués.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Résultats des runs précédents (une pull request relit ceux de main).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-${{ github.ref_name }}-
            stryker-main-
      - name: Fichiers à muter
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -E '^src/app/core/(data/[^/]+\.repo|[^/]+)\.ts$' \
              | grep -vE '\.(spec|testing)\.ts$|/(models|catalog|db|theme|clock|backup)\.ts$' || true)
            if [ -z "$changed" ]; then
              echo "Aucun fichier de logique modifié : rien à muter."
              echo "args=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$changed"
            echo "args=--mutate $(echo "$changed" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.files.outputs.skip != 'true'
        env:
          ARGS: ${{ steps.files.outputs.args }}
        run: npm run mutation -- --incremental --concurrency "$(nproc)" $ARGS
