name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      # L'app est servie sous https://<utilisateur>.github.io/<dépôt>/
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages n'a pas de redirection pour les applications monopage : 404.html = index.html.
      - run: cp dist/my-aquarium/browser/index.html dist/my-aquarium/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/my-aquarium/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
