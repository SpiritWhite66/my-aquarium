name: API

on:
  push:
    branches: [main]
    paths: ['api/**', 'shared/**', 'package.json', 'package-lock.json', 'tsconfig.node.json', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'shared/**', 'package.json', 'package-lock.json', 'tsconfig.node.json', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run server:build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      # Tests unitaires + intégration (PostgreSQL réel), seuils de couverture de 80 % bloquants.
      - run: npm run server:test
      # L'image doit se construire et répondre sur /health.
      - run: docker build -f api/Dockerfile -t aqua-api .
      - run: |
          docker run -d --name api -p 3000:3000 -e CORS_ORIGIN=https://example.github.io \
            -e DATABASE_URL="$TEST_DATABASE_URL" --network host aqua-api
          for i in $(seq 1 20); do curl -fs localhost:3000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
