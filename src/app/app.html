<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="row brand">
      <span class="logo"><app-icon name="landscape" [size]="20" /></span>
      <b>Mes aquariums</b>
    </div>
    @for (n of nav; track n.path) {
      <a class="nav" [routerLink]="n.path" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: n.exact }">
        <app-icon [name]="n.icon" />{{ n.label }}
      </a>
    }
    @if (store.tankViews().length) {
      <p class="sb">Bacs</p>
      @for (v of store.tankViews(); track v.tank.id) {
        <a class="tk" [routerLink]="['/bacs', v.tank.id]" routerLinkActive="on">
          <span class="dot" [style.color]="'var(--' + (v.level === 'ok' ? 'ok' : v.level === 'warn' ? 'wn' : 'dg') + ')'"></span>
          {{ v.tank.name }}
        </a>
      }
    }
  </aside>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="tabs" aria-label="Navigation principale">
    @for (n of nav; track n.path) {
      <a class="tab" [routerLink]="n.path" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: n.exact }">
        <span class="ic"><app-icon [name]="n.icon" /></span>{{ n.label }}
      </a>
    }
  </nav>
</div>
