<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mes aquariums">
  <defs>
    <path id="leaf" d="M0 0 C18 -26 52 -36 84 -28 C62 -6 30 4 0 0 Z"/>
  </defs>
  <!-- Eau -->
  <rect width="512" height="512" rx="112" fill="#1E4D6B"/>
  <!-- Plante à tige (gauche) -->
  <path d="M136 400 C128 320 132 230 150 132" fill="none" stroke="#5DAE7E" stroke-width="12" stroke-linecap="round"/>
  <g fill="#88D0A2">
    <use href="#leaf" transform="translate(134 340) rotate(-20)"/>
    <use href="#leaf" transform="translate(132 310) scale(-1 1) rotate(-20)"/>
    <use href="#leaf" transform="translate(134 262) rotate(-30) scale(.9)"/>
    <use href="#leaf" transform="translate(136 230) scale(-1 1) rotate(-30) scale(.9)"/>
    <use href="#leaf" transform="translate(142 184) rotate(-40) scale(.75)"/>
    <use href="#leaf" transform="translate(145 160) scale(-1 1) rotate(-40) scale(.7)"/>
  </g>
  <!-- Rosette (droite) -->
