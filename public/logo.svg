    <use href="#leaf" transform="translate(400 392) scale(-1 1) rotate(-62) scale(1.2)"/>
  </g>
  <g fill="#88D0A2">
    <use href="#leaf" transform="translate(402 392) rotate(-88) scale(1.5)"/>
  </g>
  <!-- Sable -->
  <path d="M0 384 C120 350 220 354 300 370 C380 386 440 382 512 360 V400 C512 462 462 512 400 512 H112 C50 512 0 462 0 400 Z" fill="#EADFC8"/>
  <!-- Poisson -->
